name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - jellyfin-version: 10.11.0
            framework: net9.0
            dotnet-version: 9.0.x
          - jellyfin-version: 12.0.0
            framework: net10.0
            dotnet-version: 10.0.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      - name: Restore
        run: >-
          dotnet restore Jellyfin.Plugin.AnimeFiller/Jellyfin.Plugin.AnimeFiller.csproj
          -p:JellyfinTargetFramework=${{ matrix.framework }}
          -p:JellyfinVersion=${{ matrix.jellyfin-version }}
      - name: Build
        run: >-
          dotnet build Jellyfin.Plugin.AnimeFiller/Jellyfin.Plugin.AnimeFiller.csproj
          --configuration Release --no-restore
          -p:JellyfinTargetFramework=${{ matrix.framework }}
          -p:JellyfinVersion=${{ matrix.jellyfin-version }}
      - name: Upload plugin files
        uses: actions/upload-artifact@v4
        with:
          name: animefiller-${{ matrix.jellyfin-version }}-${{ github.sha }}
          path: |
            Jellyfin.Plugin.AnimeFiller/bin/Release/${{ matrix.framework }}/Jellyfin.Plugin.AnimeFiller.dll
            Jellyfin.Plugin.AnimeFiller/bin/Release/${{ matrix.framework }}/HtmlAgilityPack.dll
          if-no-files-found: error
